<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="260" rx="12" fill="url(#bg)"/>

  <!-- connecting path -->
  <path id="mainPath" d="M110,130 L280,130 L280,130 L440,130 L440,130 L600,130 L600,130 L760,130 L760,130 L900,130"
        fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <path d="M110,130 L900,130" fill="none" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- flowing particles -->
  <circle r="4" fill="#38BDF8" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M110,130 L900,130"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#7DD3FC" filter="url(#glow)">
    <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M110,130 L900,130"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#0EA5E9" filter="url(#glow)">
    <animateMotion dur="3.2s" begin="2.2s" repeatCount="indefinite" path="M110,130 L900,130"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- node: ADMISSION -->
  <g>
    <rect x="40" y="95" width="140" height="70" rx="10" fill="#102A43" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="110" cy="130" r="3" fill="#38BDF8">
      <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="110" y="118" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="700">ADMISSION</text>
    <text x="110" y="150" text-anchor="middle" fill="#7DD3FC" font-family="monospace" font-size="10">auth · quota</text>
  </g>

  <!-- node: QUEUE -->
  <g>
    <rect x="250" y="95" width="140" height="70" rx="10" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="320" y="125" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="700">QUEUE</text>
    <text x="320" y="148" text-anchor="middle" fill="#7DD3FC" font-family="monospace" font-size="10">durable · outbox</text>
    <rect x="290" y="152" width="60" height="4" rx="2" fill="#38BDF8" opacity="0.5">
      <animate attributeName="width" values="10;60;10" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- node: WORKER -->
  <g>
    <rect x="410" y="95" width="140" height="70" rx="10" fill="#102A43" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="480" y="118" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="700">WORKER</text>
    <text x="480" y="150" text-anchor="middle" fill="#7DD3FC" font-family="monospace" font-size="10">bounded conc.</text>
    <g transform="translate(480,130)">
      <path d="M0,-12 L0,12 M-12,0 L12,0" stroke="#38BDF8" stroke-width="1.5" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- node: AI / SERVICE -->
  <g>
    <rect x="570" y="95" width="140" height="70" rx="10" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="640" y="118" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="700">AI / SERVICE</text>
    <text x="640" y="150" text-anchor="middle" fill="#7DD3FC" font-family="monospace" font-size="10">route · fallback</text>
    <circle cx="640" cy="130" r="18" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.7">
      <animate attributeName="r" values="14;22;14" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- node: RESULT / DELIVERY -->
  <g>
    <rect x="730" y="95" width="160" height="70" rx="10" fill="#102A43" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="810" y="118" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="700">RESULT</text>
    <text x="810" y="150" text-anchor="middle" fill="#7DD3FC" font-family="monospace" font-size="10">persist · deliver</text>
    <path d="M795,132 l10,10 l20,-22" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- failure/recovery loop -->
  <path d="M480,165 C480,210 320,210 320,165" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" marker-end="url(#arrow)"/>
  <text x="400" y="222" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="10">retry · backoff · DLQ</text>
</svg>
